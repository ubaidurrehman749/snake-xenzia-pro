<div class="app">

  <div class="hdr">
    <div class="brand"><span>🐍</span><b>SNAKE XENZIA PRO</b></div>
    <div class="by">by Ubaid Ur Rehman</div>
  </div>

  <div class="top">
    <div class="chip"><span>SCORE</span><b id="score">0</b></div>
    <div class="chip"><span>BEST</span><b id="best">0</b></div>
    <div class="chip"><span>LEVEL</span><b id="level">1</b><i id="lvlbar"></i></div>
    <button id="pauseBtn" type="button">⏸</button>
  </div>

  <div class="board">
    <canvas id="game"></canvas>
    <div id="count"></div>

    <div class="overlay" id="overlay">

      <div class="screen" id="menuScreen">
        <div class="logo">🐍</div>
        <h1>SNAKE XENZIA PRO</h1>
        <div class="credit">Created by <b>Ubaid Ur Rehman</b></div>
        <input id="playerName" maxlength="16" placeholder="Your player name" aria-label="Player name">
        <div class="row">
          <select id="mode" aria-label="Game mode">
            <option value="classic">Classic</option>
            <option value="obstacles">Obstacles</option>
            <option value="rush">Speed Rush</option>
          </select>
          <select id="difficulty" aria-label="Difficulty">
            <option value="175">Easy</option>
            <option value="135" selected>Medium</option>
            <option value="100">Hard</option>
          </select>
        </div>
        <button class="primary" id="startBtn" type="button">▶ PLAY</button>
        <div class="row">
          <button id="themeBtn" type="button">🎨 Neon</button>
          <button id="soundBtn" type="button">🔊 Sound On</button>
        </div>
        <div class="lb" id="leaderboard"></div>
        <div class="tip">Swipe on the board or use the arrows. 🍎 +10 &nbsp; ⭐ +30</div>
      </div>

      <div class="screen" id="msgScreen" style="display:none">
        <h2 id="overlayTitle"></h2>
        <p id="overlayText"></p>
        <button class="primary" id="resumeBtn" type="button"></button>
        <div class="row">
          <button id="restartBtn" type="button">↻ Restart</button>
          <button id="menuBtn" type="button">☰ Menu</button>
        </div>
      </div>

    </div>
  </div>

  <div class="dpad">
    <button class="up" data-dir="up" type="button">▲</button>
    <button class="left" data-dir="left" type="button">◀</button>
    <button class="down" data-dir="down" type="button">▼</button>
    <button class="right" data-dir="right" type="button">▶</button>
  </div>

  <div class="ftr">Made with ❤️ by<b>Ubaid Ur Rehman</b></div>

</div>
